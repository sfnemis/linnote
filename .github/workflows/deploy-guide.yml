name: Build the guides

# linnote.app is served by the Cloudflare Worker in web/, whose web root is
# web/public. The guides therefore have to be built into web/public/guide,
# not into docs/guide, or an edit to a guide page would never reach the
# live site.
on:
  push:
    branches: [main]
    paths:
      - 'docs/guide/**.md'
      - 'docs/guide/.vitepress/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-guides
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/guide/package-lock.json

      - name: Install dependencies
        working-directory: docs/guide
        run: npm ci

      - name: Build
        working-directory: docs/guide
        run: npm run build

      - name: Replace web/public/guide with the fresh build
        run: |
          # Replace rather than merge: copying over the old output leaves
          # every superseded hashed bundle behind, which is how two copies
          # of app.*.js and theme.*.js ended up committed.
          rm -rf web/public/guide
          mkdir -p web/public/guide
          cp -r docs/guide/.vitepress/dist/. web/public/guide/

      - name: Commit the built guides
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/guide
          git diff --staged --quiet && { echo "guides unchanged"; exit 0; }
          git commit -m "build: rebuild the guides [skip ci]"
          git push

      - name: Remind that the Worker still needs a deploy
        run: |
          echo "::notice::web/public/guide was rebuilt and committed."
          echo "::notice::Run 'cd web && npx wrangler deploy' to put it live."
