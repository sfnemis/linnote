name: Build the guides

# linnote.app is served by the Cloudflare Worker in web/, whose web root is
# web/public. The guide source lives in web/guide and vitepress is
# configured to build it straight into web/public/guide, so an edit to a
# guide page reaches the live site instead of a directory nobody serves.
on:
  push:
    branches: [main]
    paths:
      - 'web/guide/**.md'
      - 'web/guide/.vitepress/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-guides
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/guide/package-lock.json

      - name: Install dependencies
        working-directory: web/guide
        run: npm ci

      - name: Build
        working-directory: web/guide
        # vitepress is configured with outDir ../public/guide, so this
        # writes straight into the Worker's web root. It empties the
        # directory first, which is what stops superseded hashed bundles
        # accumulating the way two copies of app.*.js once did.
        run: npm run build

      - name: Commit the built guides
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/guide
          git diff --staged --quiet && { echo "guides unchanged"; exit 0; }
          git commit -m "build: rebuild the guides [skip ci]"
          git push

      - name: Remind that the Worker still needs a deploy
        run: |
          echo "::notice::web/public/guide was rebuilt and committed."
          echo "::notice::Run 'cd web && npx wrangler deploy' to put it live."
